name: Build R3G Clash Lite (Native WebUI)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/build-padavan-clash-lite.yml']

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@master

    - name: Install ghdl helper (direct + CN mirrors fallback)
      run: |
        sudo tee /usr/local/bin/ghdl > /dev/null <<'EOF'
        #!/bin/bash
        # Usage: ghdl <github-url> <outfile>
        URL="$1"; OUT="$2"
        PREFIXES=("" "https://ghfast.top/" "https://ghproxy.net/" "https://gh-proxy.com/")
        for p in "${PREFIXES[@]}"; do
          echo "[ghdl] trying: ${p}${URL}"
          if curl -fL --connect-timeout 10 --retry 1 -o "$OUT" "${p}${URL}"; then
            echo "[ghdl] OK"
            exit 0
          fi
        done
        echo "[ghdl] ALL FAILED for $URL" >&2
        exit 1
        EOF
        sudo chmod +x /usr/local/bin/ghdl

    - name: Init
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget upx xz-utils

    - name: Clone rt-n56u + toolchain (CN mirror fallback)
      run: |
        set -e
        git clone --depth=1 https://github.com/hanwckf/rt-n56u.git /opt/rt-n56u \
          || git clone --depth=1 https://ghfast.top/https://github.com/hanwckf/rt-n56u.git /opt/rt-n56u \
          || git clone --depth=1 https://ghproxy.net/https://github.com/hanwckf/rt-n56u.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        ghdl "https://github.com/hanwckf/padavan-toolchain/releases/download/v1.1/mipsel-linux-uclibc.tar.xz" /tmp/tc.tar.xz
        mkdir -p toolchain-3.4.x
        tar -xf /tmp/tc.tar.xz -C toolchain-3.4.x
        mkdir -p /opt/images/

    - name: Download payload (embedded core + native WebUI from our release)
      run: |
        set -e
        mkdir -p /opt/payload
        REL="https://github.com/520042/Padavan-build/releases/download/v1.0.0"
        ghdl "$REL/clash-linux-mipsle-softfloat.tar.gz" /tmp/clash-core.tar.gz
        cd /tmp && tar xzf clash-core.tar.gz
        cp /tmp/clash /opt/payload/clash && chmod +x /opt/payload/clash
        ghdl "$REL/panel.html" /opt/payload/index.html
        ghdl "$REL/clash-ctl" /opt/payload/clash-ctl && chmod +x /opt/payload/clash-ctl
        ghdl "$REL/clash-web.sh" /opt/payload/clash-web.sh && chmod +x /opt/payload/clash-web.sh
        # 原生 Padavan 设置页 (照 hanwckf 自带 Shadowsocks.asp 模式)
        ghdl "$REL/Advanced_Clash_Content.asp" /opt/payload/Advanced_Clash_Content.asp
        ghdl "$REL/Clash_action.asp" /opt/payload/Clash_action.asp
        grep -q 'clash_status' /opt/payload/Advanced_Clash_Content.asp || { echo "FATAL: Advanced_Clash_Content.asp 内容异常"; exit 1; }
        grep -q 'clash_action' /opt/payload/Clash_action.asp || { echo "FATAL: Clash_action.asp 内容异常"; exit 1; }
        # C 源码补丁脚本 (variables.c + web_ex.c)
        ghdl "$REL/native_patch.py" /opt/payload/native_patch.py
        grep -q 'clash_action_hook' /opt/payload/native_patch.py || { echo "FATAL: native_patch.py 内容异常"; exit 1; }
        # GeoIP 库: 经典 clash 启动时找不到会联网下载, 证书失败即 fatal 退出
        # 这正是之前"核心崩溃导致全屋断网"的根因 -> 内置精简版(CN专用 222KB)彻底消除该依赖
        ghdl "$REL/Country.mmdb" /opt/payload/Country.mmdb
        [ "$(stat -c %s /opt/payload/Country.mmdb)" -gt 100000 ] || { echo "FATAL: Country.mmdb 过小"; exit 1; }
        grep -qa "MaxMind.com" /opt/payload/Country.mmdb || { echo "FATAL: Country.mmdb 不是合法 MMDB"; exit 1; }
        echo "Country.mmdb 就绪: $(stat -c %s /opt/payload/Country.mmdb) bytes"
        ls -la /opt/payload/

    - name: Build MI-R3G (native WebUI + C patches + romfs injection)
      env:
        TNAME: MI-R3G
      run: |
        cd /opt/rt-n56u/trunk
        # 0) 版本号: 换成 "日期-本仓库commit"(北京时间), 刷完在后台一眼看出是哪一次构建
        [ -f versions.inc ] || { echo "FATAL: versions.inc 不存在"; exit 1; }
        BUILD_REV="$(TZ='Asia/Shanghai' date +%Y%m%d)-$(echo "${GITHUB_SHA:-local}" | cut -c1-7)"
        sed -i "s|^FIRMWARE_BUILDS_REV=.*|FIRMWARE_BUILDS_REV=${BUILD_REV}|" versions.inc
        grep -q "^FIRMWARE_BUILDS_REV=${BUILD_REV}$" versions.inc || { echo "FATAL: 版本号替换失败"; exit 1; }
        echo "=== 固件版本号配置 (versions.inc) ==="
        cat versions.inc
        # 1) busybox 启用 httpd applet + CGI (9091 面板服务依赖, 缺一不可)
        BB=configs/boards/busybox.config
        sed -i 's|# CONFIG_HTTPD is not set|CONFIG_HTTPD=y|' $BB
        sed -i 's|# CONFIG_FEATURE_HTTPD_CGI is not set|CONFIG_FEATURE_HTTPD_CGI=y|' $BB
        sed -i 's|# CONFIG_FEATURE_HTTPD_BASIC_AUTH is not set|CONFIG_FEATURE_HTTPD_BASIC_AUTH=y|' $BB
        grep -q '^CONFIG_HTTPD=y' $BB || { echo "FATAL: busybox CONFIG_HTTPD 未启用"; exit 1; }
        grep -q '^CONFIG_FEATURE_HTTPD_CGI=y' $BB || { echo "FATAL: busybox CONFIG_FEATURE_HTTPD_CGI 未启用"; exit 1; }
        # 2) C 源码补丁: variables.c(nvram 变量注册) + web_ex.c(ej 钩子) -> 原生 Apply/启停
        cp /opt/payload/native_patch.py user/httpd/native_patch.py
        cd user/httpd
        python3 native_patch.py || { echo "FATAL: C 补丁失败"; exit 1; }
        rm -f native_patch.py
        grep -q "variables_ClashConf" variables.c || { echo "FATAL: variables.c 补丁未生效"; exit 1; }
        grep -q "clash_action_hook" web_ex.c || { echo "FATAL: web_ex.c 补丁未生效"; exit 1; }
        grep -q "clash_status_hook" web_ex.c || { echo "FATAL: web_ex.c status 补丁未生效"; exit 1; }
        echo "=== C 补丁验证通过 (variables.c + web_ex.c) ==="
        cd /opt/rt-n56u/trunk
        # 3) 后台左侧菜单加「Clash」项 (完全照 shadowsocks 的注入模式)
        #    侧边栏: menuL2_title/menuL2_link push (index 15); 页内 tabs 数组: tabtitle[14]/tablink[14]
        #    页面 show_menu(5,15,1) -> 页内 tabs 读 tabtitle[L2-1]=[14] 对应
        python3 - <<'PYEOF'
        p = "user/www/n56u_ribbon_fixed/state.js"
        s = open(p).read()
        a1 = 'if (found_app_mentohust()){\n\tmentohust_array = new Array("","mentohust.asp","mentohust_log.asp");\n\ttablink[13] = (mentohust_array);\n}'
        assert a1 in s, "tablink mentohust anchor not found"
        s = s.replace(a1, a1 + '\nclash_array = new Array("", "Advanced_Clash_Content.asp");\ntabtitle[14] = new Array("", "Clash");\ntablink[14] = (clash_array);', 1)
        a2 = 'if (found_app_mentohust()){\n\tmenuL2_title.push("mentohust");\n} else menuL2_title.push("");'
        assert a2 in s, "menuL2_title mentohust anchor not found"
        s = s.replace(a2, a2 + '\nmenuL2_title.push("Clash");', 1)
        a3 = 'if (found_app_mentohust()){\n\tmenuL2_link.push(mentohust_array[1]);\n} else menuL2_link.push("");'
        assert a3 in s, "menuL2_link mentohust anchor not found"
        s = s.replace(a3, a3 + '\nmenuL2_link.push(clash_array[1]);', 1)
        open(p, "w").write(s)
        print("state.js patched: native Clash menu item added (L2 index 15)")
        PYEOF
        grep -q 'Advanced_Clash_Content.asp' user/www/n56u_ribbon_fixed/state.js || { echo "FATAL: state.js 菜单补丁未生效"; exit 1; }
        # 4) romfs.post 注入: strip 后 mksquashfs 前拷入 payload
        python3 - <<'PYEOF'
        old = (
          "romfs.post:\n"
          "\t-find $(ROMFSDIR)/. -name CVS | xargs -r rm -rf ; \\\n"
          "\t$(ROOTDIR)/tools/strip-romfs.sh ; \\\n"
          "\t$(MAKEARCH) -C vendors romfs.post"
        )
        new = (
          "romfs.post:\n"
          "\t-find $(ROMFSDIR)/. -name CVS | xargs -r rm -rf ; \\\n"
          "\t$(ROOTDIR)/tools/strip-romfs.sh ; \\\n"
          "\tcp -f /opt/payload/clash $(ROMFSDIR)/usr/bin/clash ; \\\n"
          "\tcp -f /opt/payload/clash-ctl $(ROMFSDIR)/usr/bin/clash-ctl ; \\\n"
          "\tcp -f /opt/payload/clash-web.sh $(ROMFSDIR)/usr/bin/clash-web.sh ; \\\n"
          "\tcp -f /opt/payload/Advanced_Clash_Content.asp $(ROMFSDIR)/www/Advanced_Clash_Content.asp ; \\\n"
          "\tcp -f /opt/payload/Clash_action.asp $(ROMFSDIR)/www/Clash_action.asp ; \\\n"
          "\tmkdir -p $(ROMFSDIR)/www2/cgi-bin ; \\\n"
          "\tcp -f /opt/payload/index.html $(ROMFSDIR)/www2/index.html ; \\\n"
          "\tcp -f /opt/payload/clash-ctl $(ROMFSDIR)/www2/cgi-bin/clash ; \\\n"
          "\tmkdir -p $(ROMFSDIR)/usr/share/clash ; \\\n"
          "\tcp -f /opt/payload/Country.mmdb $(ROMFSDIR)/usr/share/clash/Country.mmdb ; \\\n"
          "\tchmod 755 $(ROMFSDIR)/usr/bin/clash $(ROMFSDIR)/usr/bin/clash-ctl $(ROMFSDIR)/usr/bin/clash-web.sh $(ROMFSDIR)/www2/cgi-bin/clash ; \\\n"
          "\t$(MAKEARCH) -C vendors romfs.post"
        )
        s = open("Makefile").read()
        assert old in s, "romfs.post target not found"
        open("Makefile", "w").write(s.replace(old, new))
        print("Makefile patched: payload injection in romfs.post")
        PYEOF
        cp configs/templates/$TNAME.config .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config
        for f in SHADOWSOCKS SSSERVER DNSFORWARDER ADBYBY FRPC FRPS ALIDDNS SMARTDNS V2RAY XRAY TROJAN KOOLPROXY CADDY ADGUARDHOME WYY ZEROTIER MENTOHUST SCUTCLIENT TUNSAFE SRELAY; do sed -i "/CONFIG_FIRMWARE_INCLUDE_$f/d" .config; done
        echo "CONFIG_FIRMWARE_INCLUDE_OPENVPN=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y" >> .config
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv images/*.trx /opt/images/
        ls -la /opt/images/

    - name: Verify payload inside packed rootfs (hard gate)
      run: |
        cd /opt/rt-n56u/trunk
        ls -la images/
        tools/mksquashfs_xz/unsquashfs -l images/ramdisk > /tmp/rd_list.txt 2>&1 || true
        PASS=1
        for f in "usr/bin/clash" "usr/bin/clash-ctl" "www2/index.html" "www2/cgi-bin/clash" "usr/share/clash/Country.mmdb" "www/Advanced_Clash_Content.asp" "www/Clash_action.asp"; do
          grep -q "$f" /tmp/rd_list.txt || { echo "MISSING: $f"; PASS=0; }
        done
        [ "$PASS" = "1" ] || { echo "=== PAYLOAD MISSING ==="; exit 1; }
        # 硬校验: 原生页面 + 菜单 + ej 钩子链路
        rm -rf /tmp/sqx && tools/mksquashfs_xz/unsquashfs -f -d /tmp/sqx images/ramdisk "www/state.js" "www/Advanced_Clash_Content.asp" > /dev/null 2>&1
        grep -q 'Advanced_Clash_Content.asp' /tmp/sqx/www/state.js || { echo "=== MENU ITEM MISSING (state.js) ==="; exit 1; }
        grep -q 'menuL2_title.push("Clash")' /tmp/sqx/www/state.js || { echo "=== MENU LABEL MISSING ==="; exit 1; }
        grep -q 'clash_status' /tmp/sqx/www/Advanced_Clash_Content.asp || { echo "=== NATIVE PAGE BROKEN ==="; exit 1; }
        grep -q 'ClashConf' /tmp/sqx/www/state.js || true
        echo "=== NATIVE PAGE + MENU VERIFIED ==="
        # httpd 二进制必须含 clash ej 钩子(证明 C 补丁编进去了) — 硬失败, 不允许 WARN
        HTPATH=$(find romfs -type f -name httpd 2>/dev/null | head -1)
        [ -n "$HTPATH" ] || { echo "FATAL: romfs 里找不到 httpd"; exit 1; }
        strings -a "$HTPATH" | grep -q "clash_status" || { echo "FATAL: httpd 未含 clash hooks (C 补丁没编进去)"; exit 1; }
        echo "=== httpd 含 clash hooks ==="
        # busybox HTTPD + CGI 编译验证
        BBCFG=$(find user/busybox -maxdepth 2 -name ".config" 2>/dev/null | head -1)
        [ -n "$BBCFG" ] || { echo "FATAL: 找不到 busybox .config"; exit 1; }
        grep -q '^CONFIG_HTTPD=y' "$BBCFG" || { echo "FATAL: busybox 编译配置里 HTTPD 未生效"; exit 1; }
        grep -q '^CONFIG_FEATURE_HTTPD_CGI=y' "$BBCFG" || { echo "FATAL: busybox 编译配置里 CGI 未生效"; exit 1; }
        BBPATH=$(find romfs -type f -name busybox 2>/dev/null | head -1)
        [ -n "$BBPATH" ] || { echo "FATAL: romfs 里找不到 busybox"; exit 1; }
        strings -a "$BBPATH" | grep -qx "httpd" || { echo "FATAL: busybox 二进制里没有 httpd applet"; exit 1; }
        echo "=== BUSYBOX HTTPD + CGI 编译验证通过 ==="

    - name: Upload
      uses: actions/upload-artifact@master
      if: always()
      with:
        name: Padavan-R3G-ClashLite
        path: /opt/images
