variables {
dst_ip = 10.0.0.200:80;
cns_server = 152.136.154.154:443;
cns_passwd = yaohuo;
}
// [official] 官方普通免流写法
httpUDP::udp {
udp_socks5_listen = 0.0.0.0:2183
udp_tproxy_listen = 0.0.0.0:2383;
destaddr = ${dst_ip};
httpMod = tunnel;
encrypt = ${cns_passwd};
header_host = ${dst_ip};
}

tcp::Global {
tcp_listen = 0.0.0.0:2283;
}
tcpProxy::http_proxy {
destAddr4 = ${dst_ip};
httpMod = http;
}
httpMod::http {
save_line = "User-Agent" -> "0";
del_line = host;
del_line = User-Agent;
set_first = "[M] http://[H_P][U] [V]\r\nHost: [H_P]\r\nUser-Agent: use_value(User-Agent) baiduboxapp\r\n";
}
tcpProxy::https_proxy {
destAddr4 = ${dst_ip};
tunnel_proxy = httpOverTunnel;
tunnelHttpMod = tunnel;
}
httpMod::tunnel {
del_line = host;
set_first = "[M] [H] [V]\r\nHost: [H]\r\n";
}
tcpAcl::firstConnect {
tcpProxy = https_proxy;
matchMode = firstMatch;
reMatch = http;
continue: dst_port != 80;
continue: dst_port != 8080;
dst_port != 6650;
}
tcpAcl::http {
tcpProxy = http_proxy;
continue: method != IS_NOT_HTTP|CONNECT|OPTIONS;
reg_string != WebSocket;
}
tcpAcl::CONNECT {
tcpProxy = https_proxy;
dst_port != 0;
}
dns::Global {
dns_listen = 0.0.0.0:2384;
cachePath = /dev/null;
}
dnsAcl {
httpMod = dnshttp;
destAddr4 = ${dst_ip};
header_host = 119.29.29.29;
query_type = A;
}
httpMod::dnshttp {
set_first = "[M] http://[H_P]/d?dn=[D]&type=[DT]&ttl=1 [V]\r\nHost: [H_P]\r\nConnection: Close\r\n";
}
socks5::recv_socks5 {
socks5_listen = 0.0.0.0:2183;
socks5_dns = 127.0.0.1:2384;
handshake_timeout = 60;
}
